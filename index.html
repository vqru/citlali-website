<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citlali</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1B1A21;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #E2E1EB;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        body.light-mode {
            background-color: #f5f5f5;
            color: #1B1A21;
        }

        nav {
            background-color: rgba(27, 26, 33, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(226, 225, 235, 0.1);
        }

        body.light-mode nav {
            background-color: rgba(255, 255, 255, 0.8);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            color: #E2E1EB;
            text-decoration: none;
        }

        body.light-mode .logo {
            color: #1B1A21;
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: #E2E1EB;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        body.light-mode .nav-links a {
            color: #5f6368;
        }

        body.light-mode .nav-links a:hover {
            color: #1B1A21;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid rgba(226, 225, 235, 0.15);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        body.light-mode .theme-toggle:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            color: #E2E1EB;
        }

        body.light-mode .theme-toggle svg {
            color: #5f6368;
        }

        .login-btn {
            background: none;
            border: 1px solid rgba(226, 225, 235, 0.15);
            padding: 10px 16px;
            border-radius: 8px;
            color: #E2E1EB;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        body.light-mode .login-btn {
            color: #1B1A21;
        }

        body.light-mode .login-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .login-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Hero Section */
        .hero {
            padding: 120px 40px;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(226, 225, 235, 0.05);
            border: 1px solid rgba(226, 225, 235, 0.1);
            padding: 8px 16px;
            border-radius: 24px;
            width: fit-content;
            font-size: 14px;
            color: #E2E1EB;
        }

        .hero h1 {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.1;
            color: #E2E1EB;
            margin: 0;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            color: #A8A7B8;
            margin: 0;
        }

        .add-btn {
            background: #FBBDC3;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            color: #1B1A21;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: opacity 0.2s;
            width: fit-content;
            margin-top: 16px;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        .add-btn svg {
            width: 20px;
            height: 20px;
        }

        .hero-right {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }

        .character-circle {
            width: 450px;
            height: 450px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #FFE4E8, #FFD4D9);
        }

        .character-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Decorative elements */
        .deco {
            position: absolute;
            opacity: 0.6;
        }

        .star-1 {
            top: 40px;
            left: 120px;
            font-size: 48px;
        }

        .star-2 {
            top: 60px;
            right: 80px;
            font-size: 40px;
        }

        .heart-1 {
            top: 140px;
            left: 20px;
            font-size: 56px;
            opacity: 0.4;
        }

        .heart-2 {
            bottom: 140px;
            right: 20px;
            font-size: 48px;
            opacity: 0.4;
        }

        .music {
            bottom: 80px;
            left: 120px;
            font-size: 40px;
            opacity: 0.5;
        }

        .code {
            bottom: 120px;
            right: 60px;
            font-size: 32px;
            color: #4A5057;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="#" class="logo">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23FFB6C1'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white'%3E🐱%3C/text%3E%3C/svg%3E" alt="Citlali">
                <span>Citlali</span>
            </a>
            <div class="nav-links">
                <a href="#">Commands</a>
            </div>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" onclick="toggleTheme()">
                <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <svg class="sun-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </button>
            <button class="login-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                Login
            </button>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-left">
            <div class="badge">
                <span>✨</span>
                <span>The cutest bot</span>
            </div>
            <h1>Your adorable genshin companion for Discord</h1>
            <p>Create a vibrant community with the all-in-one AI chatbot. Many NSFW commands and lewd features in one place. Simple, adorable, and designed to connect.</p>
            <button class="add-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                Add to Server
            </button>
        </div>
        <div class="hero-right">
            <div class="deco star-1">⭐</div>
            <div class="deco star-2">✨</div>
            <div class="deco heart-1">💗</div>
            <div class="deco heart-2">❤️</div>
            <div class="deco music">🎵</div>
            <div class="deco code">&lt;/&gt;</div>
            <div class="character-circle">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23FFB6C1'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white'%3E🐱%3C/text%3E%3C/svg%3E" alt="Character">
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const moonIcon = document.querySelector('.moon-icon');
            const sunIcon = document.querySelector('.sun-icon');
            
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else {
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
