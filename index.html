<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekotina Layout Clone</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#1f002e,#0c0015 60%);
  color:white;
  overflow-x:hidden;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:0 25px;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 0;
}

.logo{
  font-weight:800;
  font-size:20px;
}

.nav-links a{
  margin-left:25px;
  text-decoration:none;
  color:#ddd;
  font-weight:500;
  transition:.3s;
}

.nav-links a:hover{
  color:white;
}

.hero{
  text-align:center;
  padding:140px 20px 120px;
}

.hero h1{
  font-size:58px;
  font-weight:800;
  line-height:1.1;
  background:linear-gradient(90deg,#ff4fa3,#ff82d6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:25px;
  font-size:18px;
  opacity:.8;
}

.buttons{
  margin-top:40px;
}

.btn{
  display:inline-block;
  padding:14px 32px;
  margin:8px;
  border-radius:40px;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

.btn-primary{
  background:linear-gradient(90deg,#ff4fa3,#ff82d6);
  color:white;
  box-shadow:0 0 25px rgba(255,79,163,.5);
}

.btn-primary:hover{
  transform:translateY(-3px);
}

.btn-secondary{
  border:1px solid rgba(255,255,255,.3);
  color:white;
}

.section{
  padding:120px 0;
  text-align:center;
}

.section h2{
  font-size:36px;
  margin-bottom:60px;
}

.features{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

.card{
  background:rgba(255,255,255,.05);
  padding:40px 25px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  background:rgba(255,255,255,.08);
}

footer{
  padding:60px 0;
  text-align:center;
  opacity:.5;
}
</style>
</head>

<body>

<div class="container">

<nav>
  <div class="logo">Nekotina</div>
  <div class="nav-links">
    <a href="#">Features</a>
    <a href="#">Commands</a>
    <a href="#">Support</a>
  </div>
</nav>

<section class="hero">
  <h1>Your adorable neko companion</h1>
  <p>Layout clone version — content intentionally minimal.</p>
  <div class="buttons">
    <a href="#" class="btn btn-primary">Add to Discord</a>
    <a href="#" class="btn btn-secondary">Learn More</a>
  </div>
</section>

<section class="section">
  <h2>Features</h2>
  <div class="features">
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>
</section>

<footer>
  Layout clone
</footer>

</div>

</body>
</html>
