<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Clone</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0e0818;
  font-family:sans-serif;
}

/* CONTAINER */
.container{
  width:90%;
  max-width:1300px;
  margin:auto;
}

/* NAVBAR */
nav{
  height:80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* HERO */
.hero{
  min-height:600px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:50px;
}

.hero-left{
  flex:1;
  height:400px;
}

.hero-right{
  flex:1;
  display:flex;
  justify-content:center;
}

.circle{
  width:400px;
  height:400px;
  border-radius:50%;
}

/* TRUST SECTION */
.trusted{
  height:300px;
}

/* EXTRA SECTION PLACEHOLDER */
.section{
  height:600px;
}
</style>
</head>

<body>

<div class="container">

<nav></nav>

<section class="hero">
  <div class="hero-left"></div>
  <div class="hero-right">
    <div class="circle"></div>
  </div>
</section>

</div>

<section class="trusted"></section>

<section class="section"></section>
<section class="section"></section>

</body>
</html>
