<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands - Citlali</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="https://cdn.discordapp.com/emojis/1440775765531820112.webp?size=40&quality=lossless">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1B1A21;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #E2E1EB;
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(27, 26, 33, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(226, 225, 235, 0.1);
            z-index: 1000;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            color: #E2E1EB;
            text-decoration: none;
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(251, 189, 195, 0.4);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: #E2E1EB;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid rgba(226, 225, 235, 0.15);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            color: #E2E1EB;
        }

        .animation-toggle {
            background: none;
            border: 1px solid rgba(226, 225, 235, 0.15);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background-color 0.2s;
            font-size: 20px;
        }

        .animation-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Commands Page Layout */
        .commands-container {
            padding-top: 80px;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 40px;
            padding-right: 40px;
        }

        .commands-header {
            padding: 60px 0 40px;
        }

        .commands-header h1 {
            font-size: 48px;
            font-weight: 700;
            color: #E2E1EB;
            margin-bottom: 12px;
        }

        .commands-header p {
            font-size: 18px;
            color: #A8A7B8;
        }

        .publicidad-badge {
            display: inline-block;
            background: rgba(226, 225, 235, 0.15);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #E2E1EB;
            margin: 30px 0;
        }

        .commands-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            padding-bottom: 80px;
        }

        /* Categories Sidebar */
        .categories-sidebar {
            background: rgba(226, 225, 235, 0.03);
            border: 1px solid rgba(226, 225, 235, 0.1);
            border-radius: 16px;
            padding: 24px;
            height: fit-content;
        }

        .categories-title {
            font-size: 18px;
            font-weight: 600;
            color: #E2E1EB;
            margin-bottom: 20px;
        }

        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #A8A7B8;
        }

        .category-item:hover {
            background: rgba(226, 225, 235, 0.05);
            color: #E2E1EB;
        }

        .category-item.active {
            background: #FBBDC3;
            color: #1B1A21;
            font-weight: 600;
        }

        .category-count {
            background: rgba(226, 225, 235, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .category-item.active .category-count {
            background: rgba(27, 26, 33, 0.2);
        }

        /* Commands List Area */
        .commands-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-bar {
            background: rgba(226, 225, 235, 0.05);
            border: 1px solid rgba(226, 225, 235, 0.1);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-bar svg {
            width: 20px;
            height: 20px;
            color: #A8A7B8;
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: #E2E1EB;
            font-size: 15px;
            width: 100%;
        }

        .search-bar input::placeholder {
            color: #A8A7B8;
        }

        .command-card {
            background: rgba(226, 225, 235, 0.03);
            border: 1px solid rgba(226, 225, 235, 0.1);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .command-card:hover {
            background: rgba(226, 225, 235, 0.05);
            transform: translateY(-2px);
        }

        .command-icon {
            width: 48px;
            height: 48px;
            background: rgba(226, 225, 235, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .command-info {
            flex: 1;
        }

        .command-name {
            font-size: 18px;
            font-weight: 600;
            color: #E2E1EB;
            margin-bottom: 4px;
        }

        .command-description {
            font-size: 14px;
            color: #A8A7B8;
        }

        .command-arrow {
            color: #A8A7B8;
            transition: transform 0.2s;
        }

        .command-card:hover .command-arrow {
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="index.html" class="logo">
                <img src="https://github.com/vqru/citlali-website/blob/main/7ac79be08e6d2f474b683797e1956adf.jpg?raw=true" alt="Citlali">
                <span>Citlali</span>
            </a>
            <div class="nav-links">
                <a href="commands.html">Commands</a>
            </div>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" onclick="toggleTheme()">
                <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
            <button class="animation-toggle" onclick="toggleAnimation()">
                <span class="snowflake-icon">❆</span>
                <span class="bubble-icon" style="display: none;">🫧</span>
            </button>
        </div>
    </nav>

    <div class="commands-container">
        <div class="commands-header">
            <h1>Commands</h1>
            <p>View all available commands for Citlali</p>
            <div class="publicidad-badge">Publicidad</div>
        </div>

        <div class="commands-content">
            <!-- Categories Sidebar -->
            <div class="categories-sidebar">
                <div class="categories-title">Categorías</div>
                <div class="category-item active">
                    <span>AI Chat</span>
                    <span class="category-count">0</span>
                </div>
                <div class="category-item">
                    <span>Fun</span>
                    <span class="category-count">0</span>
                </div>
                <div class="category-item">
                    <span>Utility</span>
                    <span class="category-count">0</span>
                </div>
                <div class="category-item">
                    <span>NSFW</span>
                    <span class="category-count">0</span>
                </div>
                <div class="category-item">
                    <span>Guide</span>
                    <span class="category-count">0</span>
                </div>
            </div>

            <!-- Commands List -->
            <div class="commands-list">
                <div class="search-bar">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" placeholder="Buscar comandos...">
                </div>

                <!-- Example command cards - we'll add real ones later -->
                <div class="command-card">
                    <div class="command-icon">F</div>
                    <div class="command-info">
                        <div class="command-name">8ball</div>
                        <div class="command-description">Ask Neko's magic 8-ball</div>
                    </div>
                    <svg class="command-arrow" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            // Theme toggle functionality
        }

        function toggleAnimation() {
            // Animation toggle functionality
        }

        // Category selection
        document.querySelectorAll('.category-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.category-item').forEach(cat => cat.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
